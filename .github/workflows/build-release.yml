name: Build and Release

on:
  push:
    # dev is the integration branch every push lands on; main only ever advances
    # together with a tag (main == latest release), so it doesn't need its own
    # trigger here - the tags entry below covers it.
    branches: [ dev ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish NetworkWidget.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkWidget-win-x64
          path: publish/NetworkWidget.exe
          if-no-files-found: error

      # Everything below only runs for a tagged release, since Velopack packaging
      # (Setup.exe + portable zip + update feed) is only meaningful for a real
      # published version - the plain exe above is enough to sanity-check every push.
      - name: Determine release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          echo "value=$ver" >> $env:GITHUB_OUTPUT

      - name: Remove debug symbols before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Remove-Item -Path publish/*.pdb -ErrorAction SilentlyContinue

      - name: Install Velopack CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      - name: Package release with Velopack
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk pack -u NetworkWidget -v ${{ steps.version.outputs.value }}
          -p publish -e NetworkWidget.exe -o velopack-release --icon app.ico

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} velopack-release/* --generate-notes
